[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-evals-in-ci"
version = "0.1.0"
description = "Reproducible, CI-friendly evaluation harness for agentic workflows."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Juan Carlos Orrego Díaz"}]
keywords = ["llm-evals", "agents", "ci", "quality-gates", "ai-safety"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
agent-evals = "agent_evals.evaluate:main"
agent-trace-evals = "agent_evals.traces:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
