name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest
      - name: Golden-set quality gate
        run: agent-evals --dataset evals/golden.json --min-recall 1.0 --max-false-positives 0
      - name: Trace policy quality gate
        run: agent-trace-evals --dataset evals/traces-v1.json
      - name: Upload evaluation artifact
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-result
          path: artifacts/*.json
